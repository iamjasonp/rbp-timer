[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbp-timer"
version = "0.1.0"
description = "A productivity timer for Raspberry Pi with GFX HAT and BlinkStick"
requires-python = ">=3.9"
dependencies = [
    "gfxhat>=0.0.1",
    "blinkstick>=1.2.0",
    "Pillow>=9.0.0",
    "spidev>=3.0",
    "smbus>=1.1",
    "pyusb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
rbp-timer = "rbp_timer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
